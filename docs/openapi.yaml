openapi: 3.0.3
info:
  title: Product Import API
  description: |
    API для импорта товаров из XLSX-файлов, получения списка товаров и просмотра карточек.
    Построен на Slim 4 + Doctrine ORM.
  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: /api
    description: Базовый путь API

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [System]
      summary: Проверка работоспособности
      description: Возвращает статус сервиса. Аутентификация не требуется.
      security: []
      operationId: healthCheck
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Авторизация пользователя
      description: Возвращает JWT-токен при корректных учётных данных. Аутентификация не требуется.
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Авторизация успешна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Не указан email или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /import:
    post:
      tags: [Import]
      summary: Импорт товаров из XLSX-файла
      description: |
        Загружает XLSX-файл и запускает асинхронный процесс импорта.
        Возвращает ID задачи для отслеживания статуса.
        Ограничение: 30 запросов в минуту.
      operationId: importProducts
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: XLSX-файл (макс. 50 МБ)
      responses:
        '202':
          description: Задача импорта принята
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportAccepted'
        '400':
          description: Неверный тип файла или файл не передан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /import/{id}/status:
    get:
      tags: [Import]
      summary: Получить статус задачи импорта
      description: Возвращает текущий статус и результат задачи импорта.
      operationId: getImportStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID задачи импорта
      responses:
        '200':
          description: Статус задачи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportTaskStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Задача не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products:
    get:
      tags: [Products]
      summary: Список товаров
      description: |
        Возвращает постраничный список товаров с возможностью фильтрации.
        Серверная пагинация, максимум 100 элементов на странице.
      operationId: listProducts
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Номер страницы
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Количество элементов на странице
        - name: name
          in: query
          schema:
            type: string
          description: Фильтр по названию товара (частичное совпадение)
        - name: minPrice
          in: query
          schema:
            type: number
            format: float
          description: Минимальная цена
        - name: maxPrice
          in: query
          schema:
            type: number
            format: float
          description: Максимальная цена
      responses:
        '200':
          description: Постраничный список товаров
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /products/{id}:
    get:
      tags: [Products]
      summary: Получить карточку товара
      description: Возвращает полную информацию о товаре, включая атрибуты и изображения.
      operationId: getProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID товара
      responses:
        '200':
          description: Карточка товара
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Товар не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT-токен, полученный через /auth/login

  responses:
    Unauthorized:
      description: Токен аутентификации отсутствует или недействителен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Превышен лимит запросов
      headers:
        Retry-After:
          schema:
            type: integer
          description: Количество секунд до повторной попытки
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    HealthResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@example.com
        password:
          type: string
          example: password

    LoginResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: JWT access token

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Текст ошибки

    ImportAccepted:
      type: object
      required: [task_id, status, message]
      properties:
        task_id:
          type: integer
          description: ID задачи импорта для отслеживания статуса
        status:
          type: string
          example: pending
        message:
          type: string
          example: "Импорт начат. Статус: /api/import/{id}/status"

    ImportTaskStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, processing, completed, completed_with_errors, failed]
        result:
          oneOf:
            - $ref: '#/components/schemas/ImportResult'
            - type: 'null'

    ImportResult:
      type: object
      properties:
        total_rows:
          type: integer
          description: Всего строк в файле
        imported:
          type: integer
          description: Импортировано новых товаров
        updated:
          type: integer
          description: Обновлено существующих товаров
        skipped:
          type: integer
          description: Пропущено строк
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ImportError'
        errors_count:
          type: integer
          description: Количество ошибок

    ImportError:
      type: object
      required: [row, error]
      properties:
        row:
          type: integer
          description: Номер строки в XLSX-файле (нумерация с 1, заголовок = строка 1)
        error:
          type: string
          description: Текст ошибки

    ProductListResponse:
      type: object
      required: [items, total, page, limit, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductListItem'
        total:
          type: integer
          description: Общее количество товаров
        page:
          type: integer
          description: Текущая страница
        limit:
          type: integer
          description: Элементов на странице
        total_pages:
          type: integer
          description: Всего страниц

    ProductListItem:
      type: object
      required: [id, external_code, name, price]
      properties:
        id:
          type: integer
        external_code:
          type: string
        name:
          type: string
        price:
          type: number
          format: float
        discount:
          type: number
          format: float
          nullable: true
        images_count:
          type: integer
          description: Количество изображений

    Product:
      type: object
      required: [id, external_code, name, price, created_at, updated_at, attributes, images]
      properties:
        id:
          type: integer
        external_code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          format: float
        purchase_price:
          type: number
          format: float
          nullable: true
        discount:
          type: number
          format: float
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/ProductAttribute'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'

    ProductAttribute:
      type: object
      required: [id, key]
      properties:
        id:
          type: integer
        key:
          type: string
        value:
          type: string
          nullable: true

    ProductImage:
      type: object
      required: [id, url]
      properties:
        id:
          type: integer
        url:
          type: string
          format: uri
        path:
          type: string
          nullable: true
          description: Локальный путь к файлу после скачивания
