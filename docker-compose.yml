services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist/product-import-frontend/browser:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/usr/share/uploads:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      target: production
    volumes:
      - uploads_data:/var/www/uploads
      - ./backend/src:/var/www/src
      - ./docs:/var/www/docs:ro
    environment:
      DB_HOST: db
      DB_DRIVER: pdo_mysql
      DB_NAME: ${DB_NAME:-product_import}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      JWT_EXPIRY: ${JWT_EXPIRY:-3600}
      UPLOAD_DIR: /var/www/uploads
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      APP_DEBUG: "true"
      MESSENGER_TRANSPORT_DSN: amqp://guest:guest@rabbitmq:5672/%2f/messages
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  messenger:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      target: production
    command: ["php", "bin/console", "messenger:consume", "async"]
    volumes:
      - uploads_data:/var/www/uploads
      - ./backend/migrations.php:/var/www/migrations.php
      - ./backend/migrations-db.php:/var/www/migrations-db.php
    environment:
      DB_HOST: db
      DB_DRIVER: pdo_mysql
      DB_NAME: ${DB_NAME:-product_import}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      JWT_EXPIRY: ${JWT_EXPIRY:-3600}
      UPLOAD_DIR: /var/www/uploads
      MESSENGER_TRANSPORT_DSN: amqp://guest:guest@rabbitmq:5672/%2f/messages
      APP_DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_NAME:-product_import}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db_data:
  uploads_data:
